<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Back-to-School Prep Tracker</title>
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #111111;
            --text-secondary: #777777;
            --accent: #00bcd4;
            --accent-glow: rgba(0, 188, 212, 0.2);
            --border: #e0e0e0;
            --item-bg: #fafafa;
            --item-hover: #f2f2f2;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }

        body {
            font-family: var(--font-mono);
            background-color: transparent;
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        .tracker-container {
            background: var(--bg-color);
            border: none;
            border-radius: 0;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 2px solid var(--text-color);
            padding-bottom: 8px;
        }

        select {
            background: var(--item-bg);
            color: var(--text-color);
            border: 2px solid var(--text-color);
            padding: 6px 10px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 13px;
            cursor: pointer;
            outline: none;
            font-weight: bold;
        }

        h2 {
            font-size: 15px;
            margin: 0;
            font-weight: 700;
            color: var(--text-color);
            letter-spacing: -0.5px;
        }

        .progress-bar-container {
            background: var(--item-bg);
            border-radius: 4px;
            height: 22px;
            width: 100%;
            overflow: hidden;
            margin-bottom: 16px;
            position: relative;
            border: 2px solid var(--text-color);
        }

        .progress-bar-fill {
            background: var(--accent);
            height: 100%;
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-text {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 11px;
            line-height: 18px;
            font-weight: 700;
            color: var(--text-color);
            letter-spacing: 0.5px;
        }

        .tasks-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .task-item {
            display: flex;
            align-items: center;
            background: var(--item-bg);
            padding: 12px 14px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid var(--border);
            transition: all 0.15s ease;
        }

        .task-item:hover {
            background: var(--item-hover);
            border-color: var(--text-color);
        }

        .task-item input {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #111111;
            border-radius: 3px;
            background: #ffffff;
            cursor: pointer;
            margin-right: 14px;
            position: relative;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .task-item input:checked {
            background: var(--accent);
            border-color: var(--accent);
        }

        .task-item input:checked::after {
            content: '';
            position: absolute;
            left: 5px;
            top: 1px;
            width: 4px;
            height: 9px;
            border: solid #ffffff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .task-icon {
            font-size: 16px;
            margin-right: 12px;
            display: flex;
            align-items: center;
        }

        .task-label {
            font-size: 13px;
            user-select: none;
            color: var(--text-color);
            font-weight: 500;
            letter-spacing: -0.3px;
        }

        .task-item.checked {
            background-color: rgba(0, 188, 212, 0.08);
            border-color: var(--accent);
        }
        
        .checked .task-label {
            text-decoration: line-through;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

<div class="tracker-container">
    <div class="header">
        <h2 id="date-title">Loading...</h2>
        <select id="date-select" onchange="changeDate()"></select>
    </div>

    <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-fill"></div>
        <div class="progress-text" id="progress-text">0% COMPLETE</div>
    </div>

    <div class="tasks-list" id="tasks-list"></div>
</div>

<script>
    const tasks = [
        { id: "addition", label: "Addition Drills", icon: "➕" },
        { id: "subtraction", label: "Subtraction Drills", icon: "➖" },
        { id: "movement", label: "Movement & Listening Drill", icon: "🤸" },
        { id: "reading1", label: "Reading Part 1 (45m)", icon: "📖" },
        { id: "reading2", label: "Reading Part 2 (45m)", icon: "📖" },
        { id: "workbook", label: "Workbook Time", icon: "📚" },
        { id: "writing", label: "Writing Drills", icon: "✍️" }
    ];

    let hasAnimatedForDay = false;

    const startDate = new Date(2026, 7, 26);
    const endDate = new Date(2026, 8, 9);
    const dateList = [];

    let curr = new Date(startDate);
    while (curr <= endDate) {
        const dateString = curr.toISOString().split('T')[0];
        const displayString = curr.toLocaleDateString('en-US', { month: 'short', day: 'numeric', weekday: 'short' });
        dateList.push({ key: dateString, label: displayString });
        curr.setDate(curr.getDate() + 1);
    }

    const selectEl = document.getElementById('date-select');
    dateList.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.key;
        opt.textContent = d.label;
        selectEl.appendChild(opt);
    });

    const todayStr = new Date().toISOString().split('T')[0];
    const defaultDate = dateList.some(d => d.key === todayStr) ? todayStr : dateList[0].key;
    selectEl.value = defaultDate;

    function playConfetti() {
        confetti({
            particleCount: 120,
            spread: 80,
            origin: { y: 0.6 },
            colors: ['#00bcd4', '#111111', '#80deea']
        });
    }

    function renderTracker() {
        const selectedDate = selectEl.value;
        document.getElementById('date-title').innerText = "// " + dateList.find(d => d.key === selectedDate).label;
        
        const listContainer = document.getElementById('tasks-list');
        listContainer.innerHTML = '';

        let completedCount = 0;

        tasks.push; // safety check
        tasks.forEach(task => {
            const storageKey = `tracker_${selectedDate}_${task.id}`;
            const isChecked = localStorage.getItem(storageKey) === 'true';
            if (isChecked) completedCount++;

            const item = document.createElement('div');
            item.className = `task-item ${isChecked ? 'checked' : ''}`;
            
            item.innerHTML = `
                <input type="checkbox" id="${task.id}" ${isChecked ? 'checked' : ''} onchange="toggleTask('${task.id}', this.checked)">
                <span class="task-icon">${task.icon}</span>
                <span class="task-label">${task.label}</span>
            `;
            
            item.onclick = (e) => {
                if(e.target.tagName !== 'INPUT') {
                    const checkbox = item.querySelector('input');
                    checkbox.checked = !checkbox.checked;
                    toggleTask(task.id, checkbox.checked);
                }
            };

            listContainer.appendChild(item);
        });

        const percentage = Math.round((completedCount / tasks.length) * 100);
        document.getElementById('progress-fill').style.width = percentage + '%';
        document.getElementById('progress-text').innerText = percentage + '% COMPLETE';

        if (percentage === 100 && !hasAnimatedForDay) {
            playConfetti();
            hasAnimatedForDay = true;
        }
    }

    function toggleTask(taskId, isChecked) {
        const selectedDate = selectEl.value;
        const storageKey = `tracker_${selectedDate}_${taskId}`;
        localStorage.setItem(storageKey, isChecked);
        renderTracker();
    }

    function changeDate() {
        hasAnimatedForDay = false;
        renderTracker();
    }

    renderTracker();
</script>

</body>
</html>
